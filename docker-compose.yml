services:
  # ═══════════ MySQL 数据库 ═══════════
  mysql:
    image: mysql:9.6.0
    container_name: aic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ChatRoom
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/docs/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════ Redis Stack ═══════════
  redis:
    image: redis/redis-stack-server:latest
    container_name: aic-redis
    restart: unless-stopped
    environment:
      REDIS_ARGS: --requirepass ${REDIS_PASSWORD:-123456}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ═══════════ RabbitMQ 消息队列 ═══════════
  rabbitmq:
    image: rabbitmq:management
    container_name: aic-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-123456}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════ Elasticsearch 搜索引擎 ═══════════
  elasticsearch:
    image: elasticsearch:8.15.5
    container_name: aic-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ═══════════ Milvus 向量数据库 ═══════════
  milvus:
    image: milvusdb/milvus:v3.0-beta
    container_name: aic-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      DEPLOY_MODE: STANDALONE
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
      - ./configs/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml
      - ./configs/milvus/user.yaml:/milvus/configs/user.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ═══════════ 后端 (Spring Boot) ═══════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aic-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
    environment:
      # 数据库
      MySQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      # Redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      # RabbitMQ
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-123456}
      # Elasticsearch (security disabled, no password needed)
      # DashScope API
      API_KEY: ${API_KEY}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # SMTP
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      # Tavily
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      # override localhost → container name
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ChatRoom?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      LANGCHAIN4J_COMMUNITY_MILVUS_HOST: milvus
    ports:
      - "8080:8080"

  # ═══════════ 前端 (Vue + Nginx) ═══════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aic-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  es-data:
  milvus-data: